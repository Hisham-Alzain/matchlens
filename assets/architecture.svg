<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#8fd18f"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="#0d1410"/>
  <text x="600" y="40" text-anchor="middle" fill="#e6f2e6" font-size="24" font-weight="700">MatchLens — one tactical-camera video in, a live match model out</text>

  <!-- Input -->
  <rect x="30" y="250" width="130" height="90" rx="10" fill="#17241b" stroke="#3a5a40" stroke-width="2"/>
  <text x="95" y="285" text-anchor="middle" fill="#e6f2e6" font-size="15" font-weight="600">Video</text>
  <text x="95" y="306" text-anchor="middle" fill="#9fb8a3" font-size="12">file or stream</text>
  <text x="95" y="322" text-anchor="middle" fill="#9fb8a3" font-size="12">1080p · 25–50 fps</text>
  <line x1="160" y1="295" x2="200" y2="295" stroke="#8fd18f" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Perception -->
  <rect x="205" y="90" width="290" height="400" rx="14" fill="#122019" stroke="#2f8f4e" stroke-width="2.5"/>
  <text x="350" y="125" text-anchor="middle" fill="#8fd18f" font-size="19" font-weight="700">1 · Perception</text>
  <text x="350" y="146" text-anchor="middle" fill="#9fb8a3" font-size="12">pixels → observations per frame</text>
  <g fill="#e6f2e6" font-size="13.5">
    <rect x="225" y="165" width="250" height="52" rx="8" fill="#1b2d22"/>
    <text x="350" y="186" text-anchor="middle" font-weight="600">Detection (YOLO · TensorRT)</text>
    <text x="350" y="204" text-anchor="middle" fill="#9fb8a3" font-size="12">players · goalkeepers · referees · ball</text>
    <rect x="225" y="227" width="250" height="52" rx="8" fill="#1b2d22"/>
    <text x="350" y="248" text-anchor="middle" font-weight="600">Pitch keypoints → homography</text>
    <text x="350" y="266" text-anchor="middle" fill="#9fb8a3" font-size="12">per-frame fit with a validity gate</text>
    <rect x="225" y="289" width="250" height="52" rx="8" fill="#1b2d22"/>
    <text x="350" y="310" text-anchor="middle" font-weight="600">Tracking (ByteTrack family)</text>
    <text x="350" y="328" text-anchor="middle" fill="#9fb8a3" font-size="12">ids over time · re-acquisition</text>
    <rect x="225" y="351" width="250" height="52" rx="8" fill="#1b2d22"/>
    <text x="350" y="372" text-anchor="middle" font-weight="600">Team &amp; role assignment</text>
    <text x="350" y="390" text-anchor="middle" fill="#9fb8a3" font-size="12">kit colour clustering · keeper id</text>
    <rect x="225" y="413" width="250" height="52" rx="8" fill="#1b2d22"/>
    <text x="350" y="434" text-anchor="middle" font-weight="600">Ball interpolation</text>
    <text x="350" y="452" text-anchor="middle" fill="#9fb8a3" font-size="12">bridges short misses with look-ahead</text>
  </g>
  <line x1="495" y1="290" x2="535" y2="290" stroke="#8fd18f" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- World state -->
  <rect x="540" y="90" width="290" height="400" rx="14" fill="#122019" stroke="#2f8f4e" stroke-width="2.5"/>
  <text x="685" y="125" text-anchor="middle" fill="#8fd18f" font-size="19" font-weight="700">2 · World State</text>
  <text x="685" y="146" text-anchor="middle" fill="#9fb8a3" font-size="12">observations → the match in metres</text>
  <g fill="#e6f2e6" font-size="13.5">
    <rect x="560" y="165" width="250" height="52" rx="8" fill="#1b2d22"/>
    <text x="685" y="186" text-anchor="middle" font-weight="600">Pitch-space positions &amp; velocity</text>
    <text x="685" y="204" text-anchor="middle" fill="#9fb8a3" font-size="12">105 × 68 m frame · smoothed speed</text>
    <rect x="560" y="227" width="250" height="52" rx="8" fill="#1b2d22"/>
    <text x="685" y="248" text-anchor="middle" font-weight="600">Possession state machine</text>
    <text x="685" y="266" text-anchor="middle" fill="#9fb8a3" font-size="12">who has the ball · contested · dead ball</text>
    <rect x="560" y="289" width="250" height="52" rx="8" fill="#1b2d22"/>
    <text x="685" y="310" text-anchor="middle" font-weight="600">Attacking direction per period</text>
    <text x="685" y="328" text-anchor="middle" fill="#9fb8a3" font-size="12">locked from goalkeeper position</text>
    <rect x="560" y="351" width="250" height="52" rx="8" fill="#1b2d22"/>
    <text x="685" y="372" text-anchor="middle" font-weight="600">Identity binding</text>
    <text x="685" y="390" text-anchor="middle" fill="#9fb8a3" font-size="12">tracks ↔ line-up (number, name, role)</text>
    <rect x="560" y="413" width="250" height="52" rx="8" fill="#1b2d22"/>
    <text x="685" y="434" text-anchor="middle" font-weight="600">Confidence &amp; visibility</text>
    <text x="685" y="452" text-anchor="middle" fill="#9fb8a3" font-size="12">unknown is reported, never guessed</text>
  </g>
  <line x1="830" y1="290" x2="870" y2="290" stroke="#8fd18f" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Intelligence -->
  <rect x="875" y="90" width="290" height="400" rx="14" fill="#122019" stroke="#2f8f4e" stroke-width="2.5"/>
  <text x="1020" y="125" text-anchor="middle" fill="#8fd18f" font-size="19" font-weight="700">3 · Intelligence</text>
  <text x="1020" y="146" text-anchor="middle" fill="#9fb8a3" font-size="12">state → football meaning</text>
  <g fill="#e6f2e6" font-size="13.5">
    <rect x="895" y="165" width="250" height="52" rx="8" fill="#1b2d22"/>
    <text x="1020" y="186" text-anchor="middle" font-weight="600">Rule-based event detection</text>
    <text x="1020" y="204" text-anchor="middle" fill="#9fb8a3" font-size="12">pass · carry · duel · interception · shot</text>
    <rect x="895" y="227" width="250" height="52" rx="8" fill="#1b2d22"/>
    <text x="1020" y="248" text-anchor="middle" font-weight="600">Set pieces &amp; goal arbitration</text>
    <text x="1020" y="266" text-anchor="middle" fill="#9fb8a3" font-size="12">Laws 8/15/16/17 geometry · restart as witness</text>
    <rect x="895" y="289" width="250" height="52" rx="8" fill="#1b2d22"/>
    <text x="1020" y="310" text-anchor="middle" font-weight="600">Value models: xG · xA · xT</text>
    <text x="1020" y="328" text-anchor="middle" fill="#9fb8a3" font-size="12">severable; events stand without them</text>
    <rect x="895" y="351" width="250" height="52" rx="8" fill="#1b2d22"/>
    <text x="1020" y="372" text-anchor="middle" font-weight="600">Statistics &amp; maps</text>
    <text x="1020" y="390" text-anchor="middle" fill="#9fb8a3" font-size="12">possession · heat maps · passing network</text>
    <rect x="895" y="413" width="250" height="52" rx="8" fill="#1b2d22"/>
    <text x="1020" y="434" text-anchor="middle" font-weight="600">Match record</text>
    <text x="1020" y="452" text-anchor="middle" fill="#9fb8a3" font-size="12">events + stats saved as Parquet / JSONL</text>
  </g>

  <!-- Delivery -->
  <rect x="205" y="520" width="960" height="70" rx="12" fill="#17241b" stroke="#3a5a40" stroke-width="2"/>
  <text x="685" y="548" text-anchor="middle" fill="#e6f2e6" font-size="15" font-weight="700">Delivery · FastAPI engine → WebSocket tracks &amp; events → React / Electron desktop client</text>
  <text x="685" y="571" text-anchor="middle" fill="#9fb8a3" font-size="12.5">Overlays drawn client-side on the original video · 2D tactical radar · event log · stats · heat maps · telestrator (freeze &amp; draw)</text>
  <line x1="685" y1="490" x2="685" y2="515" stroke="#8fd18f" stroke-width="2.5" marker-end="url(#arr)"/>
</svg>
